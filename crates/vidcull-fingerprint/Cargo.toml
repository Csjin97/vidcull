[package]
name = "vidcull-fingerprint"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Multi-tier compact video fingerprint generation for vidcull."

[lints.rust]
unsafe_code = "forbid"
missing_docs = "allow"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_panics_doc = "allow"
module_name_repetitions = "allow"
missing_errors_doc = "allow"

[dependencies]
vidcull-core = { path = "../vidcull-core" }
blake3 = "1"
serde = { version = "1", features = ["derive"] }
wide = "0.7"

[dev-dependencies]
vidcull-db = { path = "../vidcull-db" }
vidcull-parser = { path = "../vidcull-parser" }
vidcull-synth = { path = "../vidcull-synth" }
tempfile = "3"
proptest = { workspace = true }
criterion = { workspace = true }

[[bench]]
name = "fingerprint"
harness = false
