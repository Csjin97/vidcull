[package]
name = "vidcull-synth"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Deterministic synthetic video dataset generator (FFmpeg-driven) for regression and recall testing."

[lints.rust]
unsafe_code = "forbid"
missing_docs = "allow"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_panics_doc = "allow"
module_name_repetitions = "allow"
missing_errors_doc = "allow"

[dependencies]
vidcull-core = { path = "../vidcull-core" }
vidcull-parser = { path = "../vidcull-parser" }

[dev-dependencies]
tempfile = "3"
